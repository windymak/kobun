<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 英語学習プレイヤー（デバッグ版）</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #ff0000;
      color: #fff;
      border: none;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    /* 状況を確認するためのデバッグ表示用 */
    .debug-status {
      font-size: 0.85rem;
      color: #00ffcc;
      background: #1a1a1a;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .subtitles {
      padding: 15px;
      background: #1e1e1e;
      border-radius: 8px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .en { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
    .ja { font-size: 1rem; color: #ffeb3b; }
  </style>
</head>
<body>

  <div class="container">
    <h2>YouTube 二重字幕プレイヤー</h2>
    
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="例: https://youtu.be/xxxx または ID" value="M7lc1UVf-VE">
      <button onclick="changeVideo()">再生</button>
    </div>

    <!-- 状態確認用パネル -->
    <div class="debug-status" id="debugStatus">ステータス: 読み込み中...</div>

    <div class="video-wrapper">
      <div id="player"></div>
    </div>

    <div class="subtitles">
      <div class="en" id="enSub">動画を待機中...</div>
      <div class="ja" id="jaSub">Waiting for video</div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let timeCheckInterval;
    let currentVideoId = "M7lc1UVf-VE";

    function setStatus(msg) {
      const el = document.getElementById('debugStatus');
      if (el) el.textContent = "ステータス: " + msg;
      console.log(msg);
    }

    const subtitlesDatabase = {
      "M7lc1UVf-VE": [
        { start: 0,   end: 4,   en: "Welcome to YouTube Developers.", ja: "YouTubeデベロッパーへようこそ。" },
        { start: 4,   end: 8,   en: "Today, we are going to talk about APIs.", ja: "今日はAPIについてお話します。" },
        { start: 8,   end: 12,  en: "Let's dive right into the code.", ja: "早速コードを見ていきましょう。" },
        { start: 12,  end: 20,  en: "You can build amazing applications easily.", ja: "素晴らしいアプリケーションを簡単に作ることができます。" }
      ]
    };

    // YouTube APIの準備ができたときに呼ばれる
    window.onYouTubeIframeAPIReady = function() {
      setStatus("APIスクリプトの読み込み成功。プレイヤーを生成します...");
      try {
        player = new YT.Player('player', {
          height: '100%',
          width: '100%',
          videoId: currentVideoId,
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange,
            'onError': onPlayerError
          }
        });
      } catch (e) {
        setStatus("プレイヤー生成エラー: " + e.message);
      }
    };

    function onPlayerReady(event) {
      setStatus("プレイヤーの準備完了！再生ボタンを押してください。");
      document.getElementById('enSub').textContent = "再生ボタンを押してください";
      document.getElementById('jaSub').textContent = "Press play";
    }

    function onPlayerError(event) {
      setStatus("YouTube側エラーコード: " + event.data);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        setStatus("動画が再生中（PLAYING）");
        if (timeCheckInterval) clearInterval(timeCheckInterval);
        
        timeCheckInterval = setInterval(() => {
          if (player && typeof player.getCurrentTime === 'function') {
            const currentTime = player.getCurrentTime();
            updateSubtitles(currentTime);
          }
        }, 200);
      } else if (event.data === YT.PlayerState.PAUSED) {
        setStatus("動画が一時停止");
        if (timeCheckInterval) clearInterval(timeCheckInterval);
      } else if (event.data === YT.PlayerState.BUFFERING) {
        setStatus("動画を読み込み中（バッファリング）...");
      }
    }

    function updateSubtitles(currentTime) {
      const enSubEl = document.getElementById('enSub');
      const jaSubEl = document.getElementById('jaSub');

      const subtitlesData = subtitlesDatabase[currentVideoId] || [];
      const currentSub = subtitlesData.find(sub => currentTime >= sub.start && currentTime <= sub.end);

      if (currentSub) {
        enSubEl.textContent = currentSub.en;
        jaSubEl.textContent = currentSub.ja;
      } else {
        enSubEl.textContent = `再生中 (${Math.floor(currentTime)}秒)`;
        jaSubEl.textContent = "";
      }
    }

    window.changeVideo = function() {
      const input = document.getElementById('urlInput').value.trim();
      let videoId = "";

      if (!input) {
        alert("URLを入力してください。");
        return;
      }

      if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      } else if (input.includes('watch?v=')) {
        videoId = input.split('watch?v=')[1].split('&')[0];
      } else if (input.includes('embed/')) {
        videoId = input.split('embed/')[1].split('?')[0];
      } else {
        videoId = input;
      }

      if (videoId && videoId.length >= 10) {
        currentVideoId = videoId;
        setStatus("動画ID変更: " + videoId);
        if (player && typeof player.loadVideoById === 'function') {
          player.loadVideoById(videoId);
        }
      } else {
        alert("正しいYouTubeのURLを入力してください。");
      }
    };
  </script>
</body>
</html>
