<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 英語学習プレイヤー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #ff0000;
      color: #fff;
      border: none;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    .subtitles {
      margin-top: 15px;
      padding: 15px;
      background: #1e1e1e;
      border-radius: 8px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .en { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
    .ja { font-size: 1rem; color: #ffeb3b; }
  </style>
</head>
<body>

  <div class="container">
    <h2>YouTube 二重字幕プレイヤー</h2>
    
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="例: https://youtu.be/xxxx または ID" value="M7lc1UVf-VE">
      <button onclick="changeVideo()">再生</button>
    </div>

    <div class="video-wrapper">
      <div id="player"></div>
    </div>

    <div class="subtitles">
      <div class="en" id="enSub">再生を押すと字幕が同期します</div>
      <div class="ja" id="jaSub">Subtitles will appear here</div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let timeCheckInterval;
    let currentVideoId = "M7lc1UVf-VE"; // 現在の動画IDを保持

    // --- 動画IDごとの字幕データ辞書（ここに動画ごとのセリフを追加していく） ---
    const subtitlesDatabase = {
      // 動画1: M7lc1UVf-VE 用のデータ
      "M7lc1UVf-VE": [
        { start: 0,   end: 4,   en: "Welcome to YouTube Developers.", ja: "YouTubeデベロッパーへようこそ。" },
        { start: 4,   end: 8,   en: "Today, we are going to talk about APIs.", ja: "今日はAPIについてお話します。" },
        { start: 8,   end: 12,  en: "Let's dive right into the code.", ja: "早速コードを見ていきましょう。" },
        { start: 12,  end: 20,  en: "You can build amazing applications easily.", ja: "素晴らしいアプリケーションを簡単に作ることができます。" }
      ],
      // 動画2: 別の動画ID用（例として別のテスト用データを配置）
      "dQw4w9WgXcQ": [
        { start: 0,   end: 5,   en: "Never gonna give you up.", ja: "あなたを諦めない。" },
        { start: 5,   end: 10,  en: "Never gonna let you down.", ja: "あなたを裏切らない。" },
        { start: 10,  end: 15,  en: "Never gonna run around and desert you.", ja: "走り回ってあなたを捨てたりしない。" }
      ]
    };

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: currentVideoId,
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (timeCheckInterval) clearInterval(timeCheckInterval);
        
        timeCheckInterval = setInterval(() => {
          if (player && player.getCurrentTime) {
            const currentTime = player.getCurrentTime();
            updateSubtitles(currentTime);
          }
        }, 200);
      } else {
        if (timeCheckInterval) clearInterval(timeCheckInterval);
      }
    }

    function updateSubtitles(currentTime) {
      const enSubEl = document.getElementById('enSub');
      const jaSubEl = document.getElementById('jaSub');

      // 現在再生中の動画IDに対応する字幕データリストを取得する
      const subtitlesData = subtitlesDatabase[currentVideoId] || [];

      // そのリストの中から、現在の秒数にヒットするものを探す
      const currentSub = subtitlesData.find(sub => currentTime >= sub.start && currentTime <= sub.end);

      if (currentSub) {
        enSubEl.textContent = currentSub.en;
        jaSubEl.textContent = currentSub.ja;
      } else {
        enSubEl.textContent = "";
        jaSubEl.textContent = "";
      }
    }

    function changeVideo() {
      const input = document.getElementById('urlInput').value.trim();
      let videoId = "";

      if (!input) {
        alert("URLを入力してください。");
        return;
      }

      if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      } else if (input.includes('watch?v=')) {
        videoId = input.split('watch?v=')[1].split('&')[0];
      } else if (input.includes('embed/')) {
        videoId = input.split('embed/')[1].split('?')[0];
      } else {
        videoId = input;
      }

      if (videoId && videoId.length >= 10) {
        currentVideoId = videoId; // 読み込む動画IDを更新
        if (player && player.loadVideoById) {
          player.loadVideoById(videoId);
        }
        
        // 字幕エリアを一旦リセット
        document.getElementById('enSub').textContent = "動画を切り替えました";
        document.getElementById('jaSub').textContent = "（再生すると字幕が同期します）";
      } else {
        alert("正しいYouTubeのURLまたは動画IDを入力してください。");
      }
    }
  </script>
</body>
</html>
